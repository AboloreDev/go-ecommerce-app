run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - goimports
    - bodyclose

linters-settings:
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: exported
        arguments: [disable]

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
